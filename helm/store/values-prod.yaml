# Production Values Configuration
# Use this file for deploying to production VPS with k3s
# Usage: helm install store-xxx ./helm/store -f values-prod.yaml -n store-xxx

# Store identification (override per store)
storeId: "store-xxxxxx"

# WordPress Configuration
wordpress:
  image: wordpress:6.4-apache
  replicas: 1
  
  resources:
    requests:
      memory: "512Mi"      # Increased for production
      cpu: "250m"          # Increased for production
    limits:
      memory: "1Gi"        # Higher limit for traffic spikes
      cpu: "1000m"         # Allow burst capacity
  
  livenessProbe:
    enabled: true
    httpGet:
      path: /wp-admin/install.php
      port: 80
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  
  readinessProbe:
    enabled: true
    httpGet:
      path: /wp-admin/install.php
      port: 80
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# MySQL Configuration
mysql:
  image: mysql:8.0
  replicas: 1
  
  # IMPORTANT: Change these credentials in production!
  # Use Kubernetes Secrets or external secret management
  database: wordpress
  user: wpuser
  password: "CHANGE_ME_IN_PRODUCTION"  # Use strong password
  rootPassword: "CHANGE_ROOT_PASSWORD"  # Use strong password
  
  resources:
    requests:
      memory: "512Mi"      # Increased for production
      cpu: "250m"          # Increased for production
    limits:
      memory: "1Gi"        # Higher limit for query spikes
      cpu: "1000m"         # Allow burst capacity
  
  livenessProbe:
    enabled: true
    exec:
      command:
        - mysqladmin
        - ping
        - -h
        - localhost
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
  
  readinessProbe:
    enabled: true
    exec:
      command:
        - mysqladmin
        - ping
        - -h
        - localhost
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5

# Persistence Configuration
persistence:
  enabled: true
  
  wordpress:
    size: 5Gi                    # Increased for production content
    storageClass: "local-path"   # k3s default storage class
    accessMode: ReadWriteOnce
  
  mysql:
    size: 5Gi                    # Increased for production data
    storageClass: "local-path"   # k3s default storage class
    accessMode: ReadWriteOnce

# Ingress Configuration
ingress:
  enabled: true
  className: "nginx"             # Use nginx ingress controller
  
  # Production domain configuration
  # Replace with your actual domain
  host: "store-xxxxxx.yourdomain.com"  # CHANGE THIS
  
  annotations:
    # TLS/SSL Configuration with cert-manager
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    
    # Security headers
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    
    # Performance
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
  
  tls:
    enabled: true
    secretName: "store-xxxxxx-tls"  # Auto-generated by cert-manager

# Network Policy Configuration
networkPolicy:
  enabled: true
  
  # Ingress rules
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: ingress-nginx
      ports:
      - protocol: TCP
        port: 80
      - protocol: TCP
        port: 443
  
  # Egress rules
  egress:
    # Allow DNS
    - to:
      - namespaceSelector:
          matchLabels:
            name: kube-system
      ports:
      - protocol: UDP
        port: 53
    
    # Allow HTTP/HTTPS for WordPress updates
    - to:
      - podSelector: {}
      ports:
      - protocol: TCP
        port: 80
      - protocol: TCP
        port: 443
    
    # Allow MySQL within namespace
    - to:
      - podSelector:
          matchLabels:
            app: mysql
      ports:
      - protocol: TCP
        port: 3306

# Resource Quota (per namespace)
resourceQuota:
  enabled: true
  hard:
    requests.cpu: "2"           # Increased for production
    requests.memory: "2Gi"      # Increased for production
    limits.cpu: "4"             # Increased for production
    limits.memory: "4Gi"        # Increased for production
    persistentvolumeclaims: "3"
    services: "5"
    pods: "10"

# Limit Range (default limits per container)
limitRange:
  enabled: true
  limits:
    - max:
        cpu: "2000m"            # Increased for production
        memory: "2Gi"           # Increased for production
      min:
        cpu: "50m"
        memory: "128Mi"
      default:
        cpu: "500m"             # Higher default for production
        memory: "512Mi"         # Higher default for production
      defaultRequest:
        cpu: "250m"             # Higher default for production
        memory: "256Mi"         # Higher default for production
      type: Container

# Security Context
securityContext:
  wordpress:
    fsGroup: 33                 # www-data group
    runAsUser: 33               # www-data user (if image supports)
    runAsNonRoot: false         # WordPress needs root for Apache
  
  mysql:
    fsGroup: 999                # mysql group
    runAsUser: 999              # mysql user
    runAsNonRoot: true

# Service Account
serviceAccount:
  create: true
  name: "store-xxxxxx-sa"
  annotations: {}

# Production-specific settings
production:
  # Backup configuration (requires external backup solution)
  backup:
    enabled: false              # Set to true when backup solution is configured
    schedule: "0 2 * * *"       # Daily at 2 AM
    retention: 7                # Keep 7 days of backups
  
  # Monitoring configuration (requires Prometheus)
  monitoring:
    enabled: false              # Set to true when Prometheus is configured
    serviceMonitor:
      enabled: false
      interval: 30s
  
  # Auto-scaling (optional, requires metrics-server)
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

# Environment-specific labels
labels:
  environment: "production"
  managed-by: "helm"
  tier: "frontend"

# Annotations for all resources
annotations:
  deployment-date: "2026-02-11"
  contact: "admin@yourdomain.com"

---
# PRODUCTION DEPLOYMENT CHECKLIST
#
# Before deploying to production, ensure:
#
# 1. DNS Configuration
#    - Point *.yourdomain.com to VPS IP address
#    - Verify DNS propagation
#
# 2. TLS/SSL Setup
#    - Install cert-manager in cluster
#    - Create ClusterIssuer for Let's Encrypt
#    - Update ingress.host with actual domain
#
# 3. Secrets Management
#    - Change mysql.password and mysql.rootPassword
#    - Use strong, randomly generated passwords
#    - Consider using external secrets management (Vault, Sealed Secrets)
#
# 4. Storage Configuration
#    - Verify storage class "local-path" exists (k3s default)
#    - Or change to your cluster's storage class
#    - Ensure sufficient disk space on nodes
#
# 5. Resource Limits
#    - Adjust based on expected traffic
#    - Monitor and tune over time
#
# 6. Backup Strategy
#    - Set up automated backups for MySQL
#    - Test restore procedures
#    - Configure backup retention policy
#
# 7. Monitoring & Logging
#    - Install Prometheus/Grafana for metrics
#    - Set up centralized logging (ELK/Loki)
#    - Configure alerts for failures
#
# 8. Security Hardening
#    - Review and update NetworkPolicies
#    - Implement RBAC for service accounts
#    - Regular security updates for images
#    - Enable audit logging
#
# DEPLOYMENT COMMAND:
# helm install store-xxxxxx ./helm/store -f values-prod.yaml -n store-xxxxxx --create-namespace
#
# UPGRADE COMMAND:
# helm upgrade store-xxxxxx ./helm/store -f values-prod.yaml -n store-xxxxxx
#
# ROLLBACK COMMAND:
# helm rollback store-xxxxxx -n store-xxxxxx
